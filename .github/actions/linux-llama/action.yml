name: Build the Linux model server
description: >
  Builds llama.cpp's server for the desktop — `tool/linux/build-llama.sh` — and
  stages it where `linux/CMakeLists.txt` installs the bundle's lib/ from. Cached
  on what decides the output, the way the Android tools are: the versions and
  the recipe, and the work dir the sources unpack into is the Android build's
  own, so the key carries this file — where the recipe lives is the other half
  of what it answers.

inputs:
  stage:
    description: >
      Whether to leave the staged output in place. The llama job sets this
      false and uploads build/llama as an artifact; the app job downloads it
      and unpacks it, so the two never share a runner.
    required: false
    default: 'true'

outputs:
  filled:
    description: Whether the stage directory holds a build.
    value: ${{ steps.llama.outputs.filled }}

runs:
  using: composite
  steps:
    # The build's own list, minus the ones the app build brings: glslc for the
    # shaders, patchelf to strip the build tree's rpath, and readelf's binutils
    # for the staging check.
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build glslc patchelf binutils

    - name: Restore the built model server
      id: llama-cache
      uses: actions/cache@v6.1.0
      with:
        path: |
          tool/android/build
          build/llama
        key: linux-llama-${{ hashFiles('tool/android/versions.sh', 'tool/linux/build-llama.sh', '.github/actions/linux-llama/action.yml') }}

    - name: Build the bundled llama.cpp server
      id: llama
      if: steps.llama-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        tool/linux/build-llama.sh
        echo "filled=true" >> "$GITHUB_OUTPUT"

    # The build itself is the witness that the stage is filled; this names the
    # output for a caller whose cache hit skipped the script.
    - name: Stage them where the bundle installs from
      if: steps.llama.outputs.filled != 'true'
      shell: bash
      run: |
        test -f build/llama/llama-server ||
          { echo "::error::the llama cache restored no model server" >&2; exit 1; }
        echo "filled=true" >> "$GITHUB_OUTPUT"