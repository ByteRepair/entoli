name: Build the Linux model server
description: >
  Builds llama.cpp's server for the desktop — `tool/linux/build-llama.sh` — and
  stages it where `linux/CMakeLists.txt` installs the bundle's lib/ from, then
  uploads the stage as the `llama-linux` artifact. Cached on what decides the
  output, the way the Android tools are: the versions and the recipe, and this
  file. Only the stage is cached — the sources and objects in the work dir are
  nothing a hit reads.

runs:
  using: composite
  steps:
    - name: Restore the built model server
      id: llama-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: build/llama
        key: linux-llama-${{ hashFiles('tool/android/versions.sh', 'tool/linux/build-llama.sh', '.github/actions/linux-llama/action.yml') }}

    # Nothing on a hit path reaches for a toolchain, so the install is gated
    # with the build — the same shape bundled-tools' Ninja step has.
    - name: Install build dependencies
      if: steps.llama-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build glslc patchelf binutils

    - name: Build the bundled llama.cpp server
      if: steps.llama-cache.outputs.cache-hit != 'true'
      shell: bash
      run: tool/linux/build-llama.sh

    # From a branch only, as bundled-tools saves.
    - name: Save the built model server
      if: github.ref_type != 'tag' && steps.llama-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: build/llama
        key: ${{ steps.llama-cache.outputs.cache-primary-key }}

    # The upload below names the stage either way; this is what fails the
    # job with its own line where a cache hit restored nothing.
    - name: Confirm the stage holds a build
      shell: bash
      run: test -x build/llama/llama-server

    # Tarred because upload-artifact drops the exec bit and the symlinks the
    # sonames need; `linux-appimage` unpacks it.
    - name: Pack the stage
      shell: bash
      run: |
        mkdir -p dist
        tar -C build/llama -cf dist/llama-linux.tar .

    - uses: actions/upload-artifact@v7.0.1
      with:
        name: llama-linux
        path: dist/llama-linux.tar
        if-no-files-found: error
        # Already stripped .so files; recompressing buys little and costs time.
        compression-level: 0
        # Read by the linux job right after, so one day is enough.
        retention-days: 1
