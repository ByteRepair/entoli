name: Build the Linux model server
description: >
  Builds llama.cpp's server for the desktop with `tool/linux/build-llama.sh`
  and uploads the stage as the `llama-linux` artifact, which linux-appimage
  installs into the bundle.

runs:
  using: composite
  steps:
    - name: Restore the built model server
      id: llama-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: build/llama
        key: linux-llama-${{ hashFiles('tool/android/versions.sh', 'tool/linux/build-llama.sh', '.github/actions/linux-llama/action.yml') }}

    - name: Install build dependencies
      if: steps.llama-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build glslc patchelf binutils

    - name: Build the model server
      if: steps.llama-cache.outputs.cache-hit != 'true'
      shell: bash
      run: tool/linux/build-llama.sh

    - name: Save the built model server
      if: github.ref_type != 'tag' && steps.llama-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: build/llama
        key: ${{ steps.llama-cache.outputs.cache-primary-key }}

    # Tarred because upload-artifact drops the exec bit and the soname symlinks.
    - name: Pack the stage
      shell: bash
      run: |
        set -euo pipefail
        test -x build/llama/llama-server
        mkdir -p dist
        tar -C build/llama -cf dist/llama-linux.tar .

    - uses: actions/upload-artifact@v7.0.1
      with:
        name: llama-linux
        path: dist/llama-linux.tar
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
