name: Build the MLX framework
description: >
  Builds EntoliMLX — `tool/apple/mlx/build.sh` — into the XCFramework both
  Apple Runners link from `tool/apple/mlx/dist/`. Cached on what decides the
  output: the package, its pins, the recipe, this file and the Xcode the
  caller selected, since the module is read back by that compiler. Expects
  Xcode 27 already selected.

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        set -euo pipefail
        echo "xcode=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"

    - name: Restore the MLX framework
      id: mlx-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: tool/apple/mlx/dist/
        key: apple-mlx-${{ steps.key.outputs.xcode }}-${{ hashFiles('tool/apple/mlx/Package.swift', 'tool/apple/mlx/Package.resolved', 'tool/apple/mlx/Sources/**', 'tool/apple/mlx/build.sh', '.github/actions/apple-mlx/action.yml') }}

    # MLX compiles Metal kernels, and the image's Xcode ships without the
    # compiler for them; nothing on a hit path needs it.
    - name: Install the Metal Toolchain
      if: steps.mlx-cache.outputs.cache-hit != 'true'
      shell: bash
      run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

    - name: Build the MLX framework
      if: steps.mlx-cache.outputs.cache-hit != 'true'
      shell: bash
      run: tool/apple/mlx/build.sh

    # From a branch only, as bundled-tools saves.
    - name: Save the MLX framework
      if: github.ref_type != 'tag' && steps.mlx-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: tool/apple/mlx/dist/
        key: ${{ steps.mlx-cache.outputs.cache-primary-key }}

    - name: Confirm the framework is there
      shell: bash
      run: test -f tool/apple/mlx/dist/EntoliMLX.xcframework/Info.plist
