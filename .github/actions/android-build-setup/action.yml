name: Android build setup
description: >
  The release keystore (when `release`), Java 17, Flutter, and the
  `bundled-tools` artifact staged into the native libraries.

inputs:
  release:
    required: true
  keystore-base64:
    required: false
  keystore-password:
    required: false
  key-alias:
    required: false
  key-password:
    required: false

runs:
  using: composite
  steps:
    # The workstation's 8G heap takes a 16 GB runner down mid-build.
    - name: Fit the Gradle heap to the runner
      shell: bash
      run: |
        sed -i -e 's/-Xmx[0-9]*[GgMm]/-Xmx4G/' \
               -e 's/-XX:MaxMetaspaceSize=[0-9]*[GgMm]/-XX:MaxMetaspaceSize=1G/' \
               android/gradle.properties

    - name: Decode the release keystore
      if: inputs.release == 'true'
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
      shell: bash
      run: |
        set -euo pipefail
        for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "::error::Secret ANDROID_$name is not available to this repository"
            exit 1
          fi
        done
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

    - uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: "17"
        cache: ${{ inputs.release != 'true' && 'gradle' || '' }}

    # The image's other NDKs (~7 GB) once filled the disk mid-signing. The
    # number is flutter.ndkVersion of the SDK flutter-setup pins; a stale one
    # only leaves an unused NDK behind.
    - name: Remove the NDKs we do not build with
      shell: bash
      run: |
        pinned=28.2.13676358
        for d in "$ANDROID_HOME/ndk/"*; do
          [ "$(basename "$d")" = "$pinned" ] || rm -rf "$d"
        done

    - uses: ./.github/actions/flutter-setup

    - uses: actions/download-artifact@v8.0.1
      with:
        name: bundled-tools
        path: tool/android/dist

    - shell: bash
      run: tool/android/stage.sh
