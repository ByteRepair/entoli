name: Android build setup
description: >
  The setup every Android build shares: the release keystore (gated on
  `release`), Java 17, Flutter, the bundled-tools artifact and staging. One
  composite so the debug and release APK and AAB jobs do not copy it. The
  keystore decode runs before the SDK installs so a missing keystore fails in
  seconds rather than after a toolchain download.

inputs:
  release:
    description: Decode the release keystore and skip the Gradle cache; false for debug.
    required: true
  keystore-base64:
    description: Base64 of the release keystore. Required when release is true.
    required: false
  keystore-password:
    description: Keystore password. Required when release is true.
    required: false
  key-alias:
    description: Key alias. Required when release is true.
    required: false
  key-password:
    description: Key password. Required when release is true.
    required: false
  gradle-cache:
    description: >
      `restore` reads the Gradle caches, `save` reads them and reports the
      hit so the caller can save what it fills; nothing is cached by default,
      which is what the debug workflow runs with.
    required: false
    default: ''
  gradle-cache-key:
    description: The cache key. Required when gradle-cache is not empty.
    required: false
    default: ''

outputs:
  gradle-cache-hit:
    description: Whether the restore found the exact key. Empty when gradle-cache is not `save`.
    value: ${{ steps.gradle-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The 8G heap and 4G metaspace are a workstation's figures. A hosted
    # runner has 16 GB and its own processes beside the daemon, and a build
    # that pushes the JVM past what is left does not fail — the runner is
    # lost mid-build instead, and every step it was running with it.
    - name: Fit the Gradle heap to the runner
      shell: bash
      run: |
        set -euo pipefail
        sed -i -e 's/-Xmx[0-9]*[GgMm]/-Xmx4G/' \
               -e 's/-XX:MaxMetaspaceSize=[0-9]*[GgMm]/-XX:MaxMetaspaceSize=1G/' \
               android/gradle.properties

    - name: Decode the release keystore
      if: inputs.release == 'true'
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
      shell: bash
      run: |
        set -euo pipefail
        for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "::error::Secret ANDROID_$name is not available to this repository"
            exit 1
          fi
        done
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

    # Java 17 to match android/app/build.gradle.kts. No `cache: gradle` on a
    # tag build: it can only ever write a scope no later run can read. The
    # caches below are the same idea done manually, so the caller decides
    # where a save may happen.
    - uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: "17"
        cache: ${{ inputs.release != 'true' && 'gradle' || '' }}

    - uses: ./.github/actions/flutter-setup

    - uses: actions/download-artifact@v8.0.1
      with:
        name: bundled-tools
        path: tool/android/dist

    - name: Stage the tools into the native libraries
      shell: bash
      run: tool/android/stage.sh

    # Restored before the first Gradle run of this runner, so `save` mode
    # (build-common) fills on top of what is here and the build jobs start
    # theirs warm. The save is the caller's: it happens after the builds that
    # fill these directories, which no step of this action is.
    - id: gradle-cache
      if: inputs.gradle-cache != ''
      uses: actions/cache/restore@v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          android/.gradle
        key: ${{ inputs.gradle-cache-key }}