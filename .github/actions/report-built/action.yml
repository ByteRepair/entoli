name: Report what was built
description: >
  The built file's hash into the run summary, the shape every bash build job
  reports. The Windows job keeps its pwsh copy: no shasum there.

inputs:
  file:
    description: The built file, under dist/.
    required: true
  version-code:
    description: Printed under the hash when set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        {
          echo "### $(basename "${{ inputs.file }}")"
          echo
          echo '```'
          (cd dist && shasum -a 256 "$(basename "${{ inputs.file }}")")
          if [ -n "${{ inputs.version-code }}" ]; then
            echo "version code         ${{ inputs.version-code }}"
          fi
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"