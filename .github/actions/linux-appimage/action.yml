name: Build the Linux app
description: >
  Builds the Linux bundle in one mode, with the model server `linux-llama`
  uploaded, and packages it as an AppImage. What that
  packaging is lives in `tool/linux/`, where it can also be run by hand.

inputs:
  mode:
    description: Flutter build mode — debug or release.
    required: true
  name:
    description: File name to give the AppImage.
    required: true
  build-number:
    description: What About reports after the version. Pubspec carries none.
    required: true

outputs:
  bundle:
    description: The bundle directory, so a caller does not name the mode twice.
    value: ${{ steps.package.outputs.bundle }}
  appimage:
    description: The packaged AppImage.
    value: ${{ steps.package.outputs.appimage }}

runs:
  using: composite
  steps:
    # The stage the bundle's CMakeLists installs from — the artifact
    # `linux-llama` uploaded — unpacked and checked before `flutter build
    # linux`, so the bundle carries the server whole or not at all.
    - uses: actions/download-artifact@v8.0.1
      with:
        name: llama-linux
        path: ${{ runner.temp }}/llama-linux

    - name: Unpack and check the model server
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/llama
        tar -C build/llama -xf "$RUNNER_TEMP/llama-linux/llama-linux.tar"
        [ -x build/llama/llama-server ] ||
          { echo "::error::the llama artifact has no executable llama-server" >&2; exit 1; }
        for lib in libllama-common.so.0 libggml-base.so.0 \
          libggml-vulkan.so libggml-cpu.so; do
          [ -e "build/llama/$lib" ] ||
            { echo "::error::the llama artifact has no $lib" >&2; exit 1; }
        done

    # The Ubuntu list in README.md; keep the README part in step. cmake and
    # ninja stay here — `flutter build linux` drives the engine's own cmake
    # too — and patchelf and binutils do not: their one consumer is the
    # model-server build, which installs its own on the job that runs it.
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

    - uses: ./.github/actions/flutter-setup

    - shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BUILD_NUMBER: ${{ inputs.build-number }}
      run: flutter build linux "--$MODE" --build-number="$BUILD_NUMBER"

    - name: Package the AppImage
      id: package
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        tool/linux/make-appimage.sh "build/linux/x64/$MODE/bundle" "dist/$NAME"
        {
          echo "bundle=build/linux/x64/$MODE/bundle"
          echo "appimage=dist/$NAME"
        } >> "$GITHUB_OUTPUT"
