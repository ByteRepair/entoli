name: Build the Linux app
description: >
  Builds the Linux bundle with the `llama-linux` model server in it and
  packages it as an AppImage with `tool/linux/make-appimage.sh`.

inputs:
  mode:
    description: debug or release.
    required: true
  name:
    description: File name to give the AppImage.
    required: true
  build-number:
    required: true

outputs:
  appimage:
    value: ${{ steps.package.outputs.appimage }}

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8.0.1
      with:
        name: llama-linux
        path: ${{ runner.temp }}/llama-linux

    - name: Unpack and check the model server
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/llama
        tar -C build/llama -xf "$RUNNER_TEMP/llama-linux/llama-linux.tar"
        [ -x build/llama/llama-server ] ||
          { echo "::error::the llama artifact has no executable llama-server" >&2; exit 1; }
        for lib in libllama-common.so.0 libggml-base.so.0 \
          libggml-vulkan.so libggml-cpu-x64.so; do
          [ -e "build/llama/$lib" ] ||
            { echo "::error::the llama artifact has no $lib" >&2; exit 1; }
        done
        variants=(build/llama/libggml-cpu-*.so)
        [ "${#variants[@]}" -ge 2 ] ||
          { echo "::error::the llama artifact has one CPU backend, not its variants" >&2; exit 1; }

    # Keep in step with the Ubuntu list in README.md.
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

    - uses: ./.github/actions/flutter-setup

    - name: Build and package
      id: package
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        NAME: ${{ inputs.name }}
        BUILD_NUMBER: ${{ inputs.build-number }}
      run: |
        set -euo pipefail
        flutter build linux "--$MODE" --build-number="$BUILD_NUMBER"
        tool/linux/make-appimage.sh "build/linux/x64/$MODE/bundle" "dist/$NAME"
        echo "appimage=dist/$NAME" >> "$GITHUB_OUTPUT"
