name: Flutter setup
description: The pinned Flutter SDK, the packages and codegen.

runs:
  using: composite
  steps:
    # The one pin. A dry run only resolves the paths and keys, so the caches
    # below can be restored everywhere and saved off tags alone.
    #
    # A beta, for flutter/flutter#188965: before it, Impeller on macOS reused
    # a frame's vertex memory while the GPU was still reading it, and an
    # on-device model's GPU work garbled the window. No stable carries the
    # fix yet; the next one that does is where this goes back to stable.
    - id: flutter
      uses: subosito/flutter-action@v2.23.0
      with:
        flutter-version: 3.50.0-0.3.pre
        channel: beta
        dry-run: true

    - name: Restore the Flutter SDK
      id: sdk-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ steps.flutter.outputs.CACHE-PATH }}
        key: ${{ steps.flutter.outputs.CACHE-KEY }}

    - name: Restore the pub cache
      id: pub-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-

    - uses: subosito/flutter-action@v2.23.0
      with:
        flutter-version: ${{ steps.flutter.outputs.VERSION }}
        channel: beta

    # Keyed on the lock: build_runner's time goes on compiling its own
    # entrypoint, and it rebuilds whatever a restored graph has stale.
    - name: Restore build_runner's cache
      id: codegen-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: .dart_tool/build
        key: codegen-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: codegen-${{ runner.os }}-

    - shell: bash
      run: tool/prepare.sh

    # Off tags only: a tag's cache scope is one no later run can read. See
    # "Caches" in .github/workflows/AGENTS.md.
    - name: Save the Flutter SDK
      if: github.ref_type != 'tag' && steps.sdk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ steps.flutter.outputs.CACHE-PATH }}
        key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

    - name: Save the pub cache
      if: github.ref_type != 'tag' && steps.pub-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.pub-cache.outputs.cache-primary-key }}

    - name: Save build_runner's cache
      if: github.ref_type != 'tag' && steps.codegen-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: .dart_tool/build
        key: ${{ steps.codegen-cache.outputs.cache-primary-key }}
