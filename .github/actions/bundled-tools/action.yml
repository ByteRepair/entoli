name: Bundled tools
description: >
  Builds the tools Entoli ships inside the Android app — proot and its loader
  for every ABI, llama.cpp's server for arm64 — and uploads them as the
  `bundled-tools` artifact, which android-build-setup stages on its own runner.

outputs:
  abis:
    value: ${{ steps.abis.outputs.list }}
  llama-abis:
    value: ${{ steps.abis.outputs.llama }}

runs:
  using: composite
  steps:
    - id: abis
      shell: bash
      run: |
        echo "list=arm64-v8a armeabi-v7a x86_64" >> "$GITHUB_OUTPUT"
        echo "llama=arm64-v8a" >> "$GITHUB_OUTPUT"

    - name: Restore the built tools
      id: cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: tool/android/dist
        # This file is in the key: whether it fetches the Hexagon SDK decides
        # whether arm64 has an NPU backend, and nothing under tool/ says so.
        key: bundled-tools-${{ steps.abis.outputs.list }}-${{ hashFiles('tool/android/versions.sh', 'tool/android/build.sh', 'tool/android/talloc-config.h', '.github/actions/bundled-tools/action.yml') }}

    - name: Install Ninja
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        command -v ninja >/dev/null ||
          { sudo apt-get update && sudo apt-get install -y ninja-build; }

    # build.sh silently skips the NPU backend without it.
    - name: Fetch the Hexagon SDK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: tool/android/setup.sh

    - name: Build the tools
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      # Not through `env:`, which would blank the image's ANDROID_NDK_ROOT.
      run: |
        set -euo pipefail
        export LLAMA_ABIS="${{ steps.abis.outputs.llama }}"
        for abi in ${{ steps.abis.outputs.list }}; do
          tool/android/build.sh "$abi"
        done

    - name: Save the built tools
      if: github.ref_type != 'tag' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: tool/android/dist
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - uses: actions/upload-artifact@v7.0.1
      with:
        name: bundled-tools
        path: tool/android/dist/
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
