name: Deploy web to GitHub Pages

# The site tracks releases, not master: a release publish deploys its own tag,
# and a manual run redeploys whichever release is latest.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release to deploy
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, not interpolated into the script: a tag
          # name is arbitrary text.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName || true)
          fi
          if [ -z "$tag" ]; then
            echo "::error::No release to deploy. Publish one first." && exit 1
          fi
          echo "Deploying $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - uses: ./.github/actions/flutter-setup

      # Project pages live under /<repo>/, and canvaskit is served from the
      # site rather than gstatic so the page has no third-party dependency.
      - name: Build
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --no-web-resources-cdn

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5.0.0
