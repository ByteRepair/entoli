name: Release

# Attaches the binaries a published release is downloaded from — a signed App
# Bundle for Google Play, a Linux AppImage, a macOS DMG and a Windows MSI — to
# the tag they were built from, each with a provenance attestation beside it,
# and uploads the bundle to Play. There is no release APK; `debug-build.yml`
# builds an APK by hand. `release-build.yml` is what builds them and can be run
# on its own; `pages.yml` answers the same event for the web app.
# See "Releasing" in AGENTS.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and attach to
        required: true

# Queue rather than cancel: a superseded run leaves a release published with
# nothing on it.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    # The tag is spelled out again rather than read from `env.TAG`: a called
    # workflow's `with` cannot see the env context.
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # A job of its own so the keystore and `contents: write` are never held by
  # the same one, and one run of it per file so a bundle on the release is
  # about the file it sits beside rather than naming all of them.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the release
      # attestations: write # and the Sigstore signing certificate beside it,
      # off until the repository is public, where attest-build-provenance fails
    strategy:
      # Each entry attests and uploads a different file, so one that fails
      # should leave the other binaries attached rather than cancel them.
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.build.outputs.assets) }}
    env:
      FILE: ${{ matrix.asset.file }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ matrix.asset.artifact }}
          path: dist

      # - id: attest
      #   uses: actions/attest-build-provenance@v4.2.2
      #   with:
      #     subject-path: dist/${{ matrix.asset.file }}

      - name: Attach the binary to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --repo because gh reads it off the git remote otherwise, and this
          # job never checks out. --clobber so a re-run replaces the assets.
          gh release upload "$TAG" \
            "dist/$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Report what was published
        run: |
          set -euo pipefail
          {
            # echo "\`gh attestation verify $FILE --repo $GITHUB_REPOSITORY\`"
            # echo
            echo "$FILE attached."
          } >> "$GITHUB_STEP_SUMMARY"

  # Upload the App Bundle to Google Play. Separate from the publish matrix,
  # which attaches binaries to the GitHub release: this is the one path that
  # sends the bundle to Play, which resigns it into per-device APKs of its own.
  # See "Releasing" in AGENTS.md.
  play:
    needs: build
    uses: ./.github/workflows/publish-play.yml
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      version: ${{ needs.build.outputs.version }}
      version_code: ${{ needs.build.outputs.code }}
    secrets:
      service_account_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
