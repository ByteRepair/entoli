name: Release

# Attaches the binaries a published release is downloaded from — a signed APK
# and a Linux AppImage — to the tag they were built from, each with a
# provenance attestation beside it. `release-build.yml` is what builds them and
# can be run on its own; `pages.yml` answers the same event for the web app.
# See "Releasing" in CLAUDE.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and attach to
        required: true

# Queue rather than cancel: a superseded run leaves a release published with
# nothing on it.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    # The tag is spelled out again rather than read from `env.TAG`: a called
    # workflow's `with` cannot see the env context.
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # A job of its own so the keystore and `contents: write` are never held by
  # the same one.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the release
      id-token: write # mint the short-lived Sigstore signing certificate
      attestations: write # record the attestation against the repository
    env:
      APK: ${{ needs.build.outputs.apk }}
      APPIMAGE: ${{ needs.build.outputs.appimage }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: apk
          path: dist

      - uses: actions/download-artifact@v8.0.1
        with:
          name: appimage
          path: dist

      # One each, so a bundle on the release is about the file beside it.
      - id: attest-apk
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/${{ env.APK }}

      - id: attest-appimage
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/${{ env.APPIMAGE }}

      - name: Attach the binaries and their attestations to the release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_BUNDLE: ${{ steps.attest-apk.outputs.bundle-path }}
          APPIMAGE_BUNDLE: ${{ steps.attest-appimage.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$APK_BUNDLE" "dist/$APK.sigstore.json"
          cp "$APPIMAGE_BUNDLE" "dist/$APPIMAGE.sigstore.json"
          # --repo because gh reads it off the git remote otherwise, and this
          # job never checks out. --clobber so a re-run replaces the assets.
          gh release upload "$TAG" \
            "dist/$APK" \
            "dist/$APK.sigstore.json" \
            "dist/$APPIMAGE" \
            "dist/$APPIMAGE.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Report what was published
        run: |
          set -euo pipefail
          {
            echo "### GitHub release $TAG"
            echo
            echo 'Check a download against this build:'
            echo
            echo '```'
            echo "gh attestation verify $APK --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify $APPIMAGE --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
