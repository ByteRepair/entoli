name: Release

# Builds a published release's binaries, attaches each with a provenance
# attestation, and sends them to TestFlight and Google Play. See "Releasing"
# in AGENTS.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and attach to
        required: true

# Queue rather than cancel: a cancelled run leaves a release with nothing on it.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    # Spelled out: a called workflow's `with` cannot see `env`.
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

  # Every channel waits on a published release, or they drift apart: v6.0.0's
  # draft got assets and TestFlight while Play failed. To this read-only token
  # a draft does not exist. After the build, so publishing can catch up; then
  # re-run the failed jobs.
  gate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the release is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .tag_name >/dev/null; then
            echo "::error::Release $TAG is not published (a draft, or no release for this tag). Publish it, cancel the run that publishing starts, then re-run the failed jobs here."
            exit 1
          fi

  # A release goes out with every platform or none: `needs: build` fails if any
  # build does. One run per file, so each attestation is about one file.
  publish:
    needs: [build, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the release
      id-token: write # mint the short-lived Sigstore signing certificate
      attestations: write # record the attestation against the repository
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.build.outputs.assets) }}
    env:
      FILE: ${{ matrix.asset.file }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ matrix.asset.artifact }}
          path: dist

      - id: attest
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/${{ matrix.asset.file }}

      - name: Attach the binary and its attestation to the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "dist/$FILE.sigstore.json"
          # --clobber so a re-run replaces the assets.
          gh release upload "$TAG" \
            "dist/$FILE" \
            "dist/$FILE.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Report what was published
        run: |
          set -euo pipefail
          {
            echo "\`gh attestation verify $FILE --repo $GITHUB_REPOSITORY\`"
            echo
            echo "$FILE attached."
          } >> "$GITHUB_STEP_SUMMARY"

  testflight:
    needs: [build, gate]
    runs-on: macos-latest
    env:
      IPA: ${{ needs.build.outputs.ipa }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ipa
          path: dist

      - name: Upload to TestFlight
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # The ipa's ITSAppUsesNonExemptEncryption=false holds only with
          # France out; see "Export compliance" in ios/AGENTS.md.
          echo "Check: France is excluded from App Store availability, or the ANSSI declaration is filed (ios/AGENTS.md, Export compliance)." >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$API_ISSUER" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_KEY_P8" ]; then
            echo "::notice::No App Store Connect API key secrets; skipping the TestFlight upload"
            echo "TestFlight: skipped, no API key secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          keys="$RUNNER_TEMP/api-keys"
          mkdir -p "$keys"
          printf '%s' "$API_KEY_P8" | base64 -D -o "$keys/AuthKey_$API_KEY_ID.p8"
          export API_PRIVATE_KEYS_DIR="$keys"
          # altool is deprecated; without it the ipa goes up by hand.
          if xcrun --find altool >/dev/null 2>&1; then
            xcrun altool --upload-package "dist/$IPA" --type ios \
              --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
            echo "TestFlight: uploaded $(basename "dist/$IPA")." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::altool is not in this Xcode; upload dist/$IPA by hand"
            echo "TestFlight: altool absent; upload dist/$IPA by hand." >> "$GITHUB_STEP_SUMMARY"
          fi

  play:
    needs: [build, gate]
    uses: ./.github/workflows/publish-play.yml
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      version: ${{ needs.build.outputs.version }}
      version_code: ${{ needs.build.outputs.code }}
    secrets:
      service_account_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
