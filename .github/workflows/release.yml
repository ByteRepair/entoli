name: Release

# Attaches the binaries a published release is downloaded from — a signed App
# Bundle for Google Play, a Linux AppImage, a macOS DMG, an iOS App Store ipa
# and a Windows MSI — to the tag they were built from, each with a provenance
# attestation beside it, and uploads the bundle to Play. The ipa goes to
# TestFlight in a job of its own, Apple's processing wall clock running beside
# the attachments rather than ahead of them. There is no release APK;
# `debug-build.yml` builds an APK by hand. `release-build.yml` is what builds
# them and can be run on its own; `pages.yml` answers the same event for the
# web app. See "Releasing" in AGENTS.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and attach to
        required: true

# Queue rather than cancel: a superseded run leaves a release published with
# nothing on it.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    # The tag is spelled out again rather than read from `env.TAG`: a called
    # workflow's `with` cannot see the env context.
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

  # A job of its own so the keystore and `contents: write` are never held by
  # the same one, and one run of it per file so a bundle on the release is
  # about the file it sits beside rather than naming all of them.
  #
  # Not skipped when a build job fails: `needs: build` is the whole called
  # workflow, which fails if any one job in it does, and a plain `needs` would
  # then attach nothing at all. The version job is what names the assets, so
  # an empty list is a build that never got that far; past it, an entry whose
  # build failed fails its own download and leaves the others attached.
  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.assets != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the release
      id-token: write # mint the short-lived Sigstore signing certificate
      attestations: write # record the attestation against the repository
    strategy:
      # Each entry attests and uploads a different file, so one that fails
      # should leave the other binaries attached rather than cancel them.
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.build.outputs.assets) }}
    env:
      FILE: ${{ matrix.asset.file }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ matrix.asset.artifact }}
          path: dist

      - id: attest
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/${{ matrix.asset.file }}

      - name: Attach the binary and its attestation to the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "dist/$FILE.sigstore.json"
          # --repo because gh reads it off the git remote otherwise, and this
          # job never checks out. --clobber so a re-run replaces the assets.
          gh release upload "$TAG" \
            "dist/$FILE" \
            "dist/$FILE.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Report what was published
        run: |
          set -euo pipefail
          {
            echo "\`gh attestation verify $FILE --repo $GITHUB_REPOSITORY\`"
            echo
            echo "$FILE attached."
          } >> "$GITHUB_STEP_SUMMARY"

  # The Google Play and App Store Connect channels run beside the publish
  # matrix, both holding Apple's/Google's wall clock off it: a build, then
  # two upload jobs and the attachments, each failable without the others.
  # See "Google Play" below and the ipa notes in AGENTS.md.
  # Run past a failed build for the same reason the publish matrix is; where
  # the ios job was the one that failed, the download says so in seconds.
  testflight:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.ipa != '' }}
    runs-on: macos-latest
    env:
      IPA: ${{ needs.build.outputs.ipa }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ipa
          path: dist

      - name: Upload to TestFlight
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # First, so every arm says it: uploaded here, skipped, or left to an
          # upload by hand. The ipa says ITSAppUsesNonExemptEncryption=false,
          # which holds only with France out of the availability; see "Export
          # compliance" in ios/AGENTS.md.
          echo "Check: France is excluded from App Store availability, or the ANSSI declaration is filed (ios/AGENTS.md, Export compliance)." >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$API_ISSUER" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_KEY_P8" ]; then
            echo "::notice::No App Store Connect API key secrets; skipping the TestFlight upload"
            echo "TestFlight: skipped, no API key secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          keys="$RUNNER_TEMP/api-keys"
          mkdir -p "$keys"
          printf '%s' "$API_KEY_P8" | base64 -D -o "$keys/AuthKey_$API_KEY_ID.p8"
          export API_PRIVATE_KEYS_DIR="$keys"
          # altool is deprecated on Apple's road map; when a runner's Xcode
          # no longer ships it the step says so in the summary as well as the
          # log, and the artifact goes up by hand.
          if xcrun --find altool >/dev/null 2>&1; then
            xcrun altool --upload-package "dist/$IPA" --type ios \
              --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
            echo "TestFlight: uploaded $(basename "dist/$IPA")." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::altool is not in this Xcode; upload dist/$IPA by hand"
            echo "TestFlight: altool absent; upload dist/$IPA by hand." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Upload the App Bundle to Google Play. Separate from the publish matrix,
  # which attaches binaries to the GitHub release: this is the one path that
  # sends the bundle to Play, which resigns it into per-device APKs of its own.
  # See "Releasing" in AGENTS.md.
  play:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.version != '' }}
    uses: ./.github/workflows/publish-play.yml
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      version: ${{ needs.build.outputs.version }}
      version_code: ${{ needs.build.outputs.code }}
    secrets:
      service_account_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
