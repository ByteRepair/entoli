name: Publish to Google Play

# Uploads release-build.yml's App Bundle to Google Play; called by release.yml.
# Setup is under "Releasing" in AGENTS.md.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the release whose notes become the Play release notes
        required: true
        type: string
      version:
        description: The Play release name, and reported in the summary
        required: true
        type: string
      version_code:
        description: Reported in the summary; the value is already inside the bundle
        required: true
        type: string
    secrets:
      service_account_json:
        description: JSON key for a service account with release permissions on the app
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      BUNDLE: dist/entoli.aab
      TRACK: alpha
      # Back to production and `${{ inputs.publish && 'completed' || 'draft'
      # }}` together when Play unlocks it; a draft reaches no tester.
      STATUS: completed
    steps:
      - name: Check the service account is configured
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.service_account_json }}
        run: |
          [ -n "$SERVICE_ACCOUNT_JSON" ] ||
            { echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is not available to this repository"; exit 1; }

      - uses: actions/download-artifact@v8.0.1
        with:
          name: aab
          path: dist

      # From a file: GitHub drops an output containing a secret, and the key
      # alias is a substring of the id.
      - name: Read the application id
        id: package
        run: |
          set -euo pipefail
          name="$(cat dist/package.txt)"
          if [ -z "$name" ]; then
            echo "::error::dist/package.txt is empty; the build recorded no application id"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Play rejects notes over 500 characters; they are dropped rather than
      # cut mid-sentence.
      - name: Collect the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"; then
            echo "::warning title=Play release notes::Release $TAG could not be read (a draft is invisible to this job's token); uploading without notes"
            echo "directory=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$body" ]; then
            echo "::notice::Release $TAG has no notes; Play keeps whatever the listing already says"
          elif [ "$(printf '%s' "$body" | wc -m)" -gt 500 ]; then
            echo "::warning title=Play release notes::Notes for $TAG are over Play's 500-character limit and were not uploaded; write them in the Console"
          else
            # en-US only: Greek keeps what the Console holds.
            mkdir -p whatsnew
            printf '%s' "$body" > whatsnew/whatsnew-en-US
            echo "directory=whatsnew" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "directory=" >> "$GITHUB_OUTPUT"

      - name: Upload the bundle to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.service_account_json }}
          packageName: ${{ steps.package.outputs.name }}
          releaseFiles: ${{ env.BUNDLE }}
          releaseName: ${{ inputs.version }}
          tracks: ${{ env.TRACK }}
          status: ${{ env.STATUS }}
          whatsNewDirectory: ${{ steps.notes.outputs.directory }}

      - name: Report what reached Play
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          PACKAGE: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          {
            echo "### Google Play"
            echo
            echo '```'
            echo "package       $PACKAGE"
            echo "version       $VERSION"
            echo "version code  $VERSION_CODE"
            echo "track         $TRACK"
            echo "status        $STATUS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"