name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Each master push is a group of its own: cancelling one leaves a merge with
# no result at all.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Decided here rather than by `paths:` on the trigger: `check` is required on
  # master, and a filtered-out workflow never reports, where a skipped job
  # passes. Notes (AGENTS.md, README.md) reach no build; `assets/` always does.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      # A PR's merge commit, and a squash on master, have the base as HEAD^1.
      - id: diff
        run: |
          if git diff --name-only HEAD^1 HEAD |
            awk '/^assets\// || !/(^|\/)(AGENTS|README)\.md$/ { found = 1 } END { exit !found }'
          then echo code=true; else echo code=false; fi >> "$GITHUB_OUTPUT"

  # Format and analyze ahead of the suite, on its runner: a second job would
  # pay for a second Flutter setup.
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/flutter-setup

      # Tracked files only: the generated sources are not the repository's.
      - run: git ls-files '*.dart' | xargs dart format --output=none --set-exit-if-changed

      - run: flutter analyze

      - run: flutter test --concurrency 8
