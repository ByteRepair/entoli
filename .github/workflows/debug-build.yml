name: Debug build

on:
  workflow_dispatch:

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/bundled-tools

  android:
    needs: android-tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/android-build-setup
        with:
          release: false

      # An installer refuses to replace a build with one whose code is no newer.
      - run: flutter build apk --debug --build-number=${{ github.run_number }}

      - uses: ./.github/actions/upload-built
        with:
          file: build/app/outputs/flutter-apk/app-debug.apk
          artifact: android-debug
          retention-days: 14

  llama-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/linux-llama

  linux:
    needs: llama-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - id: build
        uses: ./.github/actions/linux-appimage
        with:
          mode: debug
          name: entoli-debug-x86_64.AppImage
          build-number: ${{ github.run_number }}

      - uses: ./.github/actions/upload-built
        with:
          file: ${{ steps.build.outputs.appimage }}
          artifact: linux-debug-appimage
          retention-days: 14
