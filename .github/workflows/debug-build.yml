name: Debug build

# Asked for, never automatic: these are minutes-long native builds, and a debug
# artifact is wanted when someone means to install one, not on every commit. A
# run builds whichever ref it was dispatched from; `release-build.yml` is the
# same two native builds cut from a tag, and `pages.yml` ships the web app.
on:
  workflow_dispatch:

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - id: tools
        uses: ./.github/actions/bundled-tools
        with:
          stage: false

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bundled-tools
          path: tool/android/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  android:
    needs: android-tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/android-build-setup
        with:
          release: false

      # Every APK is otherwise version code 1, Flutter's default where pubspec
      # names no build number, and an installer refuses to replace an installed
      # build with one no newer. The run number counts runs of *this* workflow,
      # so renaming the file restarts it at 1.
      - run: flutter build apk --debug --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          # An APK is already a zip; compressing it again buys nothing.
          compression-level: 0
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - id: build
        uses: ./.github/actions/linux-appimage
        with:
          mode: debug
          # Unversioned: dispatched from a branch, so pubspec's version would
          # name a build nobody released.
          name: entoli-debug-x86_64.AppImage
          build-number: ${{ github.run_number }}

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-debug
          path: ${{ steps.build.outputs.bundle }}
          retention-days: 14

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-debug-appimage
          path: ${{ steps.build.outputs.appimage }}
          if-no-files-found: error
          # squashfs already; compressing it again buys nothing.
          compression-level: 0
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/flutter-setup

      - run: flutter build web --debug

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: web-debug
          path: build/web
          retention-days: 14
