name: Debug build

# Master only, and deliberately not on pull requests: these are minutes-long
# native builds, where CI's gates are seconds. They are also the only Android
# and Linux binaries anything here produces — pages.yml ships web alone.
on:
  push:
    branches: [master]

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Java 17 to match android/app/build.gradle.kts, rather than whichever
      # JDK the runner image currently defaults to.
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          # An APK is already a zip; compressing it again buys nothing.
          compression-level: 0
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Flutter's documented Linux build deps. The flutter-dev toolbox in
      # CLAUDE.md exists for the same reason; keep the two in step.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build linux --debug

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-debug
          path: build/linux/x64/debug/bundle
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build web --debug

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: web-debug
          path: build/web
          retention-days: 14
