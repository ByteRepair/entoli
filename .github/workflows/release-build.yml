name: Release build

# The binaries a release is downloaded from, and the checks that stop a bad one
# being built: a signed APK and a Linux AppImage, both named after the version
# in pubspec. `release.yml` calls this and attaches what comes out; a dispatch
# says whether a tag builds without publishing anything. See "Releasing" in
# CLAUDE.md.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build, and to check pubspec's version against.
        type: string
        required: true
    # Named rather than inherited: only the APK is signed, and a caller should
    # not be handing over every secret the repository holds.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
    outputs:
      apk:
        description: The APK's file name, in the `apk` artifact.
        value: ${{ jobs.version.outputs.apk }}
      appimage:
        description: The AppImage's file name, in the `appimage` artifact.
        value: ${{ jobs.version.outputs.appimage }}
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, or nothing to build the ref this was run from
        type: string
        required: false

permissions:
  contents: read

jobs:
  # A job of its own because both builds are named after what it resolves, and
  # a tag that disagrees with pubspec then costs seconds rather than two
  # toolchain installs.
  version:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.version.outputs.code }}
      apk: ${{ steps.version.outputs.apk }}
      appimage: ${{ steps.version.outputs.appimage }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Empty is the ref the run was started from, which is what a dispatch
          # with no tag means.
          ref: ${{ inputs.tag }}

      - id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"

          # A tag disagreeing with pubspec would ship a binary reporting a
          # version nobody released. Dispatched without one there is nothing to
          # disagree with, and pubspec is the answer.
          if [ -n "$TAG" ] && [ "$version" != "${TAG#v}" ]; then
            echo "::error::Release $TAG does not match pubspec version $version"
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $version is not three dot-separated numbers"
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$version"

          # 10# so a patch of 08 is eight, not a bad octal literal. The bound
          # keeps the mapping one-to-one.
          if [ "$((10#$minor))" -ge 100 ] || [ "$((10#$patch))" -ge 100 ]; then
            echo "::error::Version $version overflows the version code; minor and patch must stay below 100"
            exit 1
          fi

          # The names are composed once, here: an attestation records its
          # subject by name, so the file attested and the file uploaded have to
          # be the same string, and they are built in different jobs.
          {
            echo "code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"
            echo "apk=entoli-$version.apk"
            echo "appimage=entoli-$version-x86_64.AppImage"
          } >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      APK: ${{ needs.version.outputs.apk }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      # Before the SDKs, so a release with no keystore behind it costs seconds
      # rather than a toolchain install.
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ANDROID_$name is not available to this repository"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Java 17 to match android/app/build.gradle.kts, rather than whichever
      # JDK the runner image currently defaults to. No `cache: gradle`: a tag
      # run can only ever write a cache scope no later run can read.
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: ./.github/actions/flutter-setup

      # Cheap on a job that already has the SDK warm, and this is the build
      # whose output cannot be quietly replaced once people have downloaded it.
      - run: flutter test

      # Before the APK is built: what this stages is packaged from the working
      # tree. See "Bundled tools" in CLAUDE.md.
      - id: tools
        uses: ./.github/actions/bundled-tools

      # Scoped to this step rather than the whole job. Without the environment
      # build.gradle.kts falls back to the debug key, which the next step
      # catches.
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number="$VERSION_CODE"

      # A debug-signed release installs fine and is caught only at the next
      # release, which will not install over it.
      - name: Check the APK is signed with the release key
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk)"
          echo "$certs"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::The release APK is signed with the debug key"
            exit 1
          fi
          echo "SIGNER=$(grep -m1 'SHA-256 digest' <<<"$certs" | awk '{print $NF}')" \
            >> "$GITHUB_ENV"

      # A release APK with no proot in it installs and runs, and the Terminal
      # settings say this build cannot run a Linux — which nobody would know was
      # a build fault rather than the truth, and is exactly the kind of thing
      # that is not noticed until it has shipped. llama.cpp's server is the
      # second, and it is checked on its own ABIs: it is arm64 only, so asking
      # for it everywhere would fail every release.
      - name: Check the tools are in the APK
        run: |
          set -euo pipefail
          check() {
            if ! unzip -l build/app/outputs/flutter-apk/app-release.apk \
                | grep -q "lib/$1/$2"; then
              echo "::error::The release APK has no $2 for $1"
              exit 1
            fi
          }
          for abi in ${{ steps.tools.outputs.abis }}; do
            for tool in libproot.so libproot-loader.so; do
              check "$abi" "$tool"
            done
          done
          for abi in ${{ steps.tools.outputs.llama-abis }}; do
            for tool in libllama-server.so libggml-cpu.so; do
              check "$abi" "$tool"
            done
          done

      - name: Name the APK after the release
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$APK"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: apk
          path: dist/${{ env.APK }}
          if-no-files-found: error
          compression-level: 0
          # Long enough to re-run the publisher by hand after a failure.
          retention-days: 7

      - name: Report what was built
        run: |
          set -euo pipefail
          {
            echo "### $APK"
            echo
            echo '```'
            (cd dist && sha256sum "$APK")
            echo "signing certificate  $SIGNER"
            echo "version code         $VERSION_CODE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - id: build
        uses: ./.github/actions/linux-appimage
        with:
          mode: release
          name: ${{ needs.version.outputs.appimage }}
          # The version code, so the AppImage and the APK report the same build.
          build-number: ${{ needs.version.outputs.code }}

      # The AppImage alone: a release asset is a file, and the bundle it was
      # built from is a directory nobody downloads a release to get.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: appimage
          path: ${{ steps.build.outputs.appimage }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
