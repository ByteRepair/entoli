name: Release build

# The binaries a release is downloaded from, and the checks that stop a bad one
# being built: a signed App Bundle for Google Play, a Linux AppImage, a macOS
# DMG, an iOS App Store ipa and a Windows MSI, named after the app and not the
# version, so the same names serve every release. No APK: Play is the Android
# channel a release serves, and a hand install builds one with `flutter build
# apk` — locally, or through debug-build.yml's dispatch. The ipa uploads to
# TestFlight as it is built; the store is the channel it is distributed
# through. `release.yml` calls this and attaches what comes out; a dispatch
# says whether a tag builds without publishing anything.
# See "Releasing" in AGENTS.md.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build, and to check pubspec's version against.
        type: string
        required: true
    # Named rather than inherited: the AAB is signed, and a caller should not
    # be handing over every secret the repository holds.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      # Apple's are optional: a caller without them gets every build but the
      # ipa, whose job fails fast on the empties instead of signing nothing.
      # The App Store Connect API key signs as well as uploads: the export
      # asks Apple for the distribution certificate and profile with it.
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_KEY_P8:
        required: false
    outputs:
      version:
        description: The pubspec version, for the Play publisher's release name.
        value: ${{ jobs.version.outputs.version }}
      code:
        description: The version code, for the Play publisher's summary.
        value: ${{ jobs.version.outputs.code }}
      ipa:
        description: The ipa's file name, for the TestFlight uploader.
        value: ${{ jobs.version.outputs.ipa }}
      assets:
        description: >
          Every file to attach, as `{file, artifact}` objects naming the
          upload each is in. A caller drives one publish per entry.
        value: ${{ jobs.version.outputs.assets }}
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, or nothing to build the ref this was run from
        type: string
        required: false

permissions:
  contents: read

jobs:
  # A job of its own because both builds are named after what it resolves, and
  # a tag that disagrees with pubspec then costs seconds rather than two
  # toolchain installs.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      aab: ${{ steps.version.outputs.aab }}
      appimage: ${{ steps.version.outputs.appimage }}
      dmg: ${{ steps.version.outputs.dmg }}
      msi: ${{ steps.version.outputs.msi }}
      ipa: ${{ steps.version.outputs.ipa }}
      assets: ${{ steps.version.outputs.assets }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Empty is the ref the run was started from, which is what a dispatch
          # with no tag means.
          ref: ${{ inputs.tag }}

      - id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"

          # A tag disagreeing with pubspec would ship a binary reporting a
          # version nobody released. Dispatched without one there is nothing to
          # disagree with, and pubspec is the answer.
          if [ -n "$TAG" ] && [ "$version" != "${TAG#v}" ]; then
            echo "::error::Release $TAG does not match pubspec version $version"
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $version is not three dot-separated numbers"
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$version"

          # 10# so a patch of 08 is eight, not a bad octal literal. The bound
          # keeps the mapping one-to-one.
          if [ "$((10#$minor))" -ge 100 ] || [ "$((10#$patch))" -ge 100 ]; then
            echo "::error::Version $version overflows the version code; minor and patch must stay below 100"
            exit 1
          fi

          # The names are composed once, here: the publisher names the file it
          # uploads from a different job than the one that built it. None
          # carries the version — the tag says it, and one name on every
          # release is one name for a downloader to know.
          aab="entoli.aab"
          appimage="entoli-x86_64.AppImage"
          dmg="entoli-universal.dmg"
          msi="entoli-installer.msi"
          ipa="entoli.ipa"

          {
            echo "version=$version"
            echo "code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"
            echo "aab=$aab"
            echo "appimage=$appimage"
            echo "dmg=$dmg"
            echo "msi=$msi"
            echo "ipa=$ipa"
            echo "assets=$(jq -nc --arg aab "$aab" --arg appimage "$appimage" --arg dmg "$dmg" --arg msi "$msi" --arg ipa "$ipa" \
              '[{file: $aab, artifact: "aab"},
                 {file: $appimage, artifact: "appimage"},
                 {file: $dmg, artifact: "dmg"},
                 {file: $msi, artifact: "msi"},
                 {file: $ipa, artifact: "ipa"}]')"
          } >> "$GITHUB_OUTPUT"

  # The native tools build and the bundle build run on separate runners. The
  # tools job fetches the 660 MiB Hexagon SDK and cross-compiles proot and
  # llama.cpp — several gigabytes of intermediates that the app build does not
  # need and that left a single runner with no disk. It builds only, uploads
  # the stripped dist/ as an artifact, and the runner is recycled with all its
  # build directories. The aab job downloads that artifact onto a fresh runner
  # with the full disk free for Gradle.
  android-tools:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      abis: ${{ steps.tools.outputs.abis }}
      llama-abis: ${{ steps.tools.outputs.llama-abis }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - id: tools
        uses: ./.github/actions/bundled-tools
        with:
          stage: false

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bundled-tools
          path: tool/android/dist/
          if-no-files-found: error
          # Already stripped .so files; recompressing buys little and costs time.
          compression-level: 0
          # Read by the aab job right after; no re-run of a publisher wants it,
          # unlike the aab itself.
          retention-days: 1

  # The App Bundle for Google Play. One file carrying every ABI. Its whole
  # Gradle setup happens here, inline: a priming job and a warm cache existed
  # to be shared between two build jobs, and with the APK builds gone there is
  # one consumer, for whom priming paid the same configure twice and moved a
  # multi-gigabyte cache nobody else read. `flutter build appbundle`
  # regenerates `android/gradlew` — gitignored — on its way.
  aab:
    needs: [version, android-tools]
    runs-on: ubuntu-latest
    env:
      AAB: ${{ needs.version.outputs.aab }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/android-build-setup
        with:
          release: true
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # From Gradle, so the id uploaded under cannot drift from the id the app
      # is built with. A file rather than a job output: GitHub drops an output
      # whose value contains a registered secret, and the key alias is a
      # substring of io.byterepair.entoli — see "Releasing" in AGENTS.md.
      - name: Record the application id
        run: |
          set -euo pipefail
          package="$(sed -n 's/^ *applicationId = "\(.*\)"/\1/p' android/app/build.gradle.kts)"
          if [ -z "$package" ]; then
            echo "::error::No applicationId found in android/app/build.gradle.kts"
            exit 1
          fi
          mkdir -p dist
          printf '%s' "$package" > dist/package.txt

      - name: Build the App Bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-number="$VERSION_CODE"

      # A bundle is a signed jar rather than an APK, so keytool reads its
      # certificate.
      - name: Check the bundle is signed with the release key
        run: |
          set -euo pipefail
          built="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$built" ]; then
            echo "::error::The build produced no App Bundle"
            exit 1
          fi
          certs="$(keytool -printcert -jarfile "$built")"
          echo "$certs"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::The App Bundle is signed with the debug key"
            exit 1
          fi

      - name: Name the bundle after the release
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/$AAB"

      # A bundle carries every ABI in one file: every tool ABI must be
      # present, and the llama.cpp set is checked on arm64 only.
      - name: Check the bundle carries every ABI's tools
        env:
          TOOL_ABIS: ${{ needs.android-tools.outputs.abis }}
          LLAMA_ABIS: ${{ needs.android-tools.outputs.llama-abis }}
        run: |
          set -euo pipefail
          has() { [[ " $1 " == *" $2 "* ]]; }
          libs="$(unzip -l "dist/$AAB" | grep -o 'lib/[^/]*/[^ ]*' || true)"

          for abi in $TOOL_ABIS; do
            for tool in libproot.so libproot-loader.so; do
              if ! grep -qx "lib/$abi/$tool" <<<"$libs"; then
                echo "::error::dist/$AAB has no $tool for $abi"
                exit 1
              fi
            done
          done

          for abi in $LLAMA_ABIS; do
            for tool in libllama-server.so libggml-cpu.so libggml-hexagon.so; do
              if ! grep -qx "lib/$abi/$tool" <<<"$libs"; then
                echo "::error::dist/$AAB has no $tool for $abi"
                exit 1
              fi
            done
            if ! grep -q "^lib/$abi/libggml-htp-" <<<"$libs"; then
              echo "::error::dist/$AAB has no DSP libraries for the NPU backend"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: aab
          path: |
            dist/${{ env.AAB }}
            dist/package.txt
          if-no-files-found: error
          compression-level: 0
          # Long enough to re-run the publisher by hand after a failure.
          retention-days: 7

      - uses: ./.github/actions/report-built
        with:
          file: dist/${{ env.AAB }}
          version-code: ${{ env.VERSION_CODE }}

  # The desktop model server and the app run on separate runners, the way the
  # Android tools and bundle do: the server build is a native cmake of
  # llama.cpp with minutes of its own, and the app build has no use for the
  # toolchain under it. The llama job builds and uploads the stage as an
  # artifact; the linux job downloads it before `flutter build linux`, so the
  # bundle either carries the server whole or not at all. The cache lives on
  # the llama job, whose only other content is two apt packages, so a cache
  # miss costs the build alone rather than a Flutter setup too.
  llama-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/linux-llama

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: llama-linux
          path: build/llama/
          if-no-files-found: error
          # Already stripped .so files; recompressing buys little and costs time.
          compression-level: 0
          # Read by the linux job right after; a re-run of the publisher never
          # wants it, unlike the aab, so one day is enough.
          retention-days: 1

  # The iOS App Store ipa. One macos runner rather than a tools/application
  # split: the iSH core is a minutes-long clang build of one library, not a
  # toolchain the app build never needs, and the app build wants the
  # xcframework in tool/ios/ish/dist/ already in the tree — the xcconfig
  # force-loads it from there. Signing is Xcode's automatic signing, driven
  # by the App Store Connect API key: the archive is built unsigned and the
  # export signs it, asking Apple for a cloud-managed distribution
  # certificate and a profile as it goes. No certificate or profile is
  # stored anywhere, and an unsigned archive means no fresh runner mints an
  # Apple Development certificate of its own.
  ios:
    needs: version
    runs-on: macos-latest
    env:
      IPA: ${{ needs.version.outputs.ipa }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      # The Apple material is checked before the runner fetches anything:
      # a wrong or empty secret is a seconds-long failure on the cheapest
      # possible step, ahead of the checkout's submodule fetch and the
      # Flutter setup.
      - name: Check the Apple signing secrets
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$API_ISSUER" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_KEY_P8" ]; then
            echo "::error::APPLE_API_ISSUER, APPLE_API_KEY_ID or APPLE_API_KEY_P8 is empty"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - uses: ./.github/actions/flutter-setup

      # Cached on the submodule gitlink and the repo's own inputs to the
      # build, so a release whose iSH pin has not moved restores the
      # xcframework and skips both the brew bottles and the compile.
      - id: ishkey
        run: |
          set -euo pipefail
          echo "key=ish-$(git rev-parse HEAD:tool/ios/ish/src)-$( \
            shasum -a 256 tool/ios/ish/build.sh tool/ios/ish/ish_bridge.c | \
            shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore the IshCore xcframework
        id: ishcache
        uses: actions/cache@v6.1.0
        with:
          path: tool/ios/ish/dist/
          key: ${{ steps.ishkey.outputs.key }}

      - name: Build the IshCore xcframework
        if: steps.ishcache.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install --quiet llvm lld
          tool/ios/ish/build.sh

      # Archived unsigned, then exported with automatic signing. The key is
      # decoded into runner temp and dies with the runner; it needs the
      # Admin role, since the export creates the distribution certificate
      # and the profile when Apple has none to hand back.
      - name: Archive the app unsigned
        run: |
          set -euo pipefail
          flutter build ipa --release --build-number="$VERSION_CODE" --no-codesign
          if [ ! -d build/ios/archive/Runner.xcarchive ]; then
            echo "::error::flutter build ipa produced no archive"
            exit 1
          fi

      # The export options are tool/ios/ExportOptions.plist, the file an
      # upload from a Mac uses, so the two cannot drift; the team is the one
      # it names. Its destination is the one difference: that file uploads
      # as it exports, and here the ipa is written to disk for the release
      # and the testflight job uploads it.
      - name: Sign and export the ipa
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          printf '%s' "$API_KEY_P8" | base64 -D -o "$key"
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp tool/ios/ExportOptions.plist "$options"
          plutil -replace destination -string export "$options"
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

      - name: Name the ipa after the release
        run: |
          set -euo pipefail
          built="$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1 || true)"
          if [ -z "$built" ]; then
            echo "::error::The export produced no ipa"
            exit 1
          fi
          mkdir -p dist
          cp "$built" "dist/$IPA"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ipa
          path: dist/${{ env.IPA }}
          if-no-files-found: error
          # The ipa is already a zip.
          compression-level: 0
          retention-days: 7

      - uses: ./.github/actions/report-built
        with:
          file: dist/${{ env.IPA }}
          version-code: ${{ env.VERSION_CODE }}

  # The desktop model server and the app run on separate runners, the way the
  # Android tools and bundle do: the server build is a native cmake of
  # llama.cpp with minutes of its own, and the app build has no use for the
  # toolchain under it. The llama job builds and uploads the stage as an
  # artifact; the linux job downloads it before `flutter build linux`, so the
  # bundle either carries the server whole or not at all. The cache lives on
  # the llama job, whose only other content is two apt packages, so a cache
  # miss costs the build alone rather than a Flutter setup too.
  linux:
    needs: [version, llama-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      # The stage the bundle's CMakeLists installs from — the artifact the llama
      # job uploaded. Unpacked before `flutter build linux` runs, which is what
      # makes the "whole or not at all" above true.
      - uses: actions/download-artifact@v8.0.1
        with:
          name: llama-linux
          path: build/llama

      - name: Check the downloaded model server is whole
        run: |
          set -euo pipefail
          for lib in llama-server libllama-common.so.0 libggml-base.so.0 \
            libggml-vulkan.so libggml-cpu.so; do
            [ -e "build/llama/$lib" ] ||
              { echo "::error::the llama artifact has no $lib" >&2; exit 1; }
          done

      - id: build
        uses: ./.github/actions/linux-appimage
        with:
          mode: release
          name: ${{ needs.version.outputs.appimage }}
          build-number: ${{ needs.version.outputs.code }}

      # The AppImage alone: a release asset is a file, and the bundle it was
      # built from is a directory nobody downloads a release to get.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: appimage
          path: ${{ steps.build.outputs.appimage }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The macOS DMG, built from the same tree the AppImage is, on this host's
  # architecture family and Intel both — Flutter's macOS build is universal
  # unless the Xcode target narrows it, and one image covers both. Nothing
  # signs it yet: enrollment is what brings the Developer ID identity and the
  # notarytool profile, and `make-dmg.sh --sign` is where the former goes. What
  # ships until then is ad-hoc signed, which Finder's right-click Open runs;
  # see "The DMG" in macos/AGENTS.md.
  macos:
    needs: version
    runs-on: macos-latest
    env:
      DMG: ${{ needs.version.outputs.dmg }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/flutter-setup

      - name: Build the app bundle
        run: flutter build macos --release --build-number="${{ needs.version.outputs.code }}"

      # make-dmg.sh fails when the app is not there, and codesign's verify step
      # refuses to pass an image whose signature does not check out — there is
      # no second place to catch a half-built one.
      - name: Package the DMG
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/Entoli.app"
          [ -d "$app" ] || {
            echo "::error::flutter build macos produced no $app"
            exit 1
          }
          tool/macos/make-dmg.sh "$app" "dist/$DMG"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dmg
          path: dist/${{ env.DMG }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - uses: ./.github/actions/report-built
        with:
          file: dist/${{ env.DMG }}

  # The Windows MSI, built on the Windows runner nothing on this host can stand
  # in for. Like the macos job it builds the app alone — no model server is
  # cross-compiled for it, and what a Release build without one produces is
  # what the installer packages — and like the DMG nothing signs it yet,
  # SmartScreen's Run anyway being how the first run goes until a certificate
  # exists; see windows/AGENTS.md.
  windows:
    needs: version
    runs-on: windows-latest
    env:
      MSI: ${{ needs.version.outputs.msi }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/flutter-setup

      - name: Build the app
        run: flutter build windows --release --build-number="${{ needs.version.outputs.code }}"

      # make-msi.ps1 refuses a bundle with no exe and an MSI with no exe in it:
      # there is no second place to catch a half-built one or an empty harvest.
      - name: Package the MSI
        shell: pwsh
        run: ./tool/windows/make-msi.ps1 "build/windows/x64/runner/Release" "dist/${{ env.MSI }}" -Version "${{ env.VERSION }}"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: msi
          path: dist/${{ env.MSI }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Report what was built
        shell: pwsh
        run: |
          # A fence without quoting games: one backtick, three times.
          $fence = [string][char]96 * 3
          $hash = (Get-FileHash "dist/$env:MSI" -Algorithm SHA256).Hash.ToLower()
          @("### $env:MSI", "", $fence, $hash, $fence) |
            Add-Content $env:GITHUB_STEP_SUMMARY