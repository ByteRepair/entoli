name: Release build

# Builds what release.yml attaches: a signed App Bundle, a Linux AppImage, a
# macOS DMG, an iOS ipa and a Windows MSI. Dispatched by hand, it checks a tag
# builds without publishing anything. See "Releasing" in AGENTS.md.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build, and to check pubspec's version against.
        type: string
        required: true
    # Named rather than inherited, so a caller hands over only these. Apple's
    # are optional: without them the ios and macos jobs fail fast.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_KEY_P8:
        required: false
      MACOS_CERT_P12:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}
      code:
        value: ${{ jobs.version.outputs.code }}
      ipa:
        value: ${{ jobs.version.outputs.ipa }}
      assets:
        description: Every file to attach, as `{file, artifact}` objects.
        value: ${{ jobs.version.outputs.assets }}
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, or nothing to build the ref this was run from
        type: string
        required: false

permissions:
  contents: read

jobs:
  # First, so a tag that disagrees with pubspec fails in seconds.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      aab: ${{ steps.version.outputs.aab }}
      appimage: ${{ steps.version.outputs.appimage }}
      dmg: ${{ steps.version.outputs.dmg }}
      msi: ${{ steps.version.outputs.msi }}
      ipa: ${{ steps.version.outputs.ipa }}
      assets: ${{ steps.version.outputs.assets }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"

          if [ -n "$TAG" ] && [ "$version" != "${TAG#v}" ]; then
            echo "::error::Release $TAG does not match pubspec version $version"
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $version is not three dot-separated numbers"
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$version"

          # 10# so 08 is eight rather than bad octal; the bound keeps the code
          # one-to-one with the version.
          if [ "$((10#$minor))" -ge 100 ] || [ "$((10#$patch))" -ge 100 ]; then
            echo "::error::Version $version overflows the version code; minor and patch must stay below 100"
            exit 1
          fi

          # Unversioned, so every release has the same download names.
          assets='[{"file": "entoli.aab", "artifact": "aab"},
                   {"file": "entoli-x86_64.AppImage", "artifact": "appimage"},
                   {"file": "entoli-arm64.dmg", "artifact": "dmg"},
                   {"file": "entoli-installer.msi", "artifact": "msi"},
                   {"file": "entoli.ipa", "artifact": "ipa"}]'
          {
            echo "version=$version"
            echo "code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"
            jq -r '.[] | "\(.artifact)=\(.file)"' <<<"$assets"
            echo "assets=$(jq -c . <<<"$assets")"
          } >> "$GITHUB_OUTPUT"

  # Apart from the aab job: the tools' intermediates left one runner no disk.
  android-tools:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      abis: ${{ steps.tools.outputs.abis }}
      llama-abis: ${{ steps.tools.outputs.llama-abis }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - id: tools
        uses: ./.github/actions/bundled-tools

  aab:
    needs: [version, android-tools]
    runs-on: ubuntu-latest
    env:
      AAB: ${{ needs.version.outputs.aab }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/android-build-setup
        with:
          release: true
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # A file rather than a job output: GitHub drops an output containing a
      # secret, and the key alias is a substring of the id.
      - name: Record the application id
        run: |
          set -euo pipefail
          package="$(sed -n 's/^ *applicationId = "\(.*\)"/\1/p' android/app/build.gradle.kts)"
          if [ -z "$package" ]; then
            echo "::error::No applicationId found in android/app/build.gradle.kts"
            exit 1
          fi
          mkdir -p dist
          printf '%s' "$package" > dist/package.txt

      - name: Build the App Bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build appbundle --release --build-number="$VERSION_CODE"
          cp build/app/outputs/bundle/release/app-release.aab "dist/$AAB"

      # A changed signer is the one thing a user cannot recover from, so its
      # fingerprint goes in the summary.
      - name: Check the bundle is signed with the release key
        run: |
          set -euo pipefail
          certs="$(keytool -printcert -jarfile "dist/$AAB")"
          echo "$certs"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::The App Bundle is signed with the debug key"
            exit 1
          fi
          {
            echo "### Signer"
            echo
            echo '```'
            { grep -m1 'SHA256:' <<<"$certs" || true; } | sed 's/^[[:space:]]*//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the bundle carries every ABI's tools
        env:
          TOOL_ABIS: ${{ needs.android-tools.outputs.abis }}
          LLAMA_ABIS: ${{ needs.android-tools.outputs.llama-abis }}
        run: |
          set -euo pipefail
          libs="$(unzip -l "dist/$AAB" | grep -o 'lib/[^/]*/[^ ]*' || true)"
          need() {
            grep -q "$1" <<<"$libs" || { echo "::error::dist/$AAB has no $2"; exit 1; }
          }

          for abi in $TOOL_ABIS; do
            for tool in libproot.so libproot-loader.so; do
              need "^lib/$abi/$tool\$" "$tool for $abi"
            done
          done

          for abi in $LLAMA_ABIS; do
            # The baseline by name and others beside it, so ggml renaming the
            # rest does not break this.
            if [ "$(grep -c "^lib/$abi/libggml-cpu-" <<<"$libs")" -lt 2 ]; then
              echo "::error::dist/$AAB has no CPU backend variants for $abi"
              exit 1
            fi
            for tool in libllama-server.so libggml-cpu-android_armv8.0_1.so libggml-hexagon.so; do
              need "^lib/$abi/$tool\$" "$tool for $abi"
            done
            need "^lib/$abi/libggml-htp-" "DSP libraries for the NPU backend"
          done

      - uses: ./.github/actions/upload-built
        with:
          file: dist/${{ env.AAB }}
          extra: dist/package.txt
          artifact: aab
          version-code: ${{ env.VERSION_CODE }}

  llama-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/linux-llama

  linux:
    needs: [version, llama-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - id: build
        uses: ./.github/actions/linux-appimage
        with:
          mode: release
          name: ${{ needs.version.outputs.appimage }}
          build-number: ${{ needs.version.outputs.code }}

      - uses: ./.github/actions/upload-built
        with:
          file: ${{ steps.build.outputs.appimage }}
          artifact: appimage
          version-code: ${{ needs.version.outputs.code }}

  # Archived unsigned, then exported with Xcode's automatic signing driven by
  # the App Store Connect API key (Admin role), so no certificate or profile is
  # stored anywhere.
  #
  # xcode-27 rather than macos-latest: AppleFmChannel.swift needs the iOS 27
  # SDK to compile. Back to macos-latest once that carries Xcode 27.
  ios:
    needs: version
    runs-on: xcode-27
    env:
      IPA: ${{ needs.version.outputs.ipa }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - name: Check the signing secrets
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in API_ISSUER API_KEY_ID API_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::Secret APPLE_$name is empty"; exit 1; }
          done

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - uses: ./.github/actions/apple-setup
        with:
          slice: ios

      - id: ishkey
        run: |
          set -euo pipefail
          echo "key=ish-$(git rev-parse HEAD:tool/ios/ish/src)-$( \
            shasum -a 256 tool/ios/ish/build.sh tool/ios/ish/ish_bridge.c \
              tool/ios/ish/ish_bridge.h | \
            shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore the IshCore xcframework
        id: ishcache
        uses: actions/cache/restore@v6.1.0
        with:
          path: tool/ios/ish/dist/
          key: ${{ steps.ishkey.outputs.key }}

      - name: Build the IshCore xcframework
        if: steps.ishcache.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install --quiet llvm lld
          tool/ios/ish/build.sh

      - name: Save the IshCore xcframework
        if: github.ref_type != 'tag' && steps.ishcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: tool/ios/ish/dist/
          key: ${{ steps.ishkey.outputs.key }}

      # The export options are the ones an upload from a Mac uses, writing to
      # disk instead; the testflight job uploads.
      - name: Archive and export the ipa
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          flutter build ipa --release --build-number="$VERSION_CODE" --no-codesign
          key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          printf '%s' "$API_KEY_P8" | base64 -D -o "$key"
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp tool/ios/ExportOptions.plist "$options"
          plutil -replace destination -string export "$options"
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"
          built="$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1 || true)"
          if [ -z "$built" ]; then
            echo "::error::The export produced no ipa"
            exit 1
          fi
          mkdir -p dist
          cp "$built" "dist/$IPA"

      - uses: ./.github/actions/upload-built
        with:
          file: dist/${{ env.IPA }}
          artifact: ipa
          version-code: ${{ env.VERSION_CODE }}

  # Signed with the Developer ID certificate and notarized with the ios job's
  # API key, the ticket stapled; see "The DMG" in macos/AGENTS.md.
  macos:
    needs: version
    runs-on: xcode-27
    env:
      DMG: ${{ needs.version.outputs.dmg }}
    steps:
      # Before the build, so a bad certificate or key fails in seconds. The
      # partition list lets codesign use the key without a prompt. The
      # keychain path is an output at once, so the removal step runs even when
      # the import fails.
      - name: Import the Developer ID certificate and the API key
        id: cert
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in CERT_P12 CERT_PASSWORD API_ISSUER API_KEY_ID API_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::Secret for $name is empty"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpass="$(openssl rand -hex 24)"
          p12="$RUNNER_TEMP/cert.p12"
          trap 'rm -f "$p12"' EXIT
          printf '%s' "$CERT_P12" | base64 -D -o "$p12"
          security create-keychain -p "$kpass" "$keychain"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERT_P12 holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          printf '%s' "$API_KEY_P8" | base64 -D -o "$key"
          xcrun notarytool history --key "$key" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" >/dev/null
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/apple-setup
        with:
          slice: macos

      - name: Build and sign the DMG
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          set -euo pipefail
          flutter build macos --release --build-number="${{ needs.version.outputs.code }}"
          tool/macos/make-dmg.sh build/macos/Build/Products/Release/Entoli.app "dist/$DMG" --sign "$IDENTITY"

      # The status decides, not notarytool's exit, so a rejection still prints
      # Apple's log. Three hours: the team's first submission outlasted one.
      - name: Notarize the DMG
        env:
          KEY: ${{ steps.cert.outputs.key }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          auth=(--key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER")
          result="$(xcrun notarytool submit "dist/$DMG" "${auth[@]}" \
            --wait --timeout 3h --output-format json)" || true
          id="$(printf '%s' "$result" | plutil -extract id raw -o - - 2>/dev/null || true)"
          status="$(printf '%s' "$result" | plutil -extract status raw -o - - 2>/dev/null || true)"
          if [ -z "$status" ] && [ -n "$id" ]; then
            echo "::error::Notarization of $id did not finish within the wait; Apple is still processing it (xcrun notarytool info $id)"
            exit 1
          fi
          if [ "$status" != Accepted ]; then
            echo "::error::Notarization ended ${status:-without a status}"
            [ -n "$id" ] && xcrun notarytool log "$id" "${auth[@]}" || true
            exit 1
          fi
          xcrun stapler staple "dist/$DMG"
          xcrun stapler validate "dist/$DMG"
          spctl -a -t open --context context:primary-signature -vv "dist/$DMG"

      - name: Remove the signing keychain
        if: always() && steps.cert.outputs.keychain != ''
        run: security delete-keychain "${{ steps.cert.outputs.keychain }}"

      - uses: ./.github/actions/upload-built
        with:
          file: dist/${{ env.DMG }}
          artifact: dmg

  # Unsigned for now; see windows/AGENTS.md.
  windows:
    needs: version
    runs-on: windows-latest
    env:
      MSI: ${{ needs.version.outputs.msi }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/flutter-setup

      # Not the version code: FILEVERSION's 16-bit field overflows on it.
      - run: flutter build windows --release --build-number=0

      - shell: pwsh
        run: ./tool/windows/make-msi.ps1 "build/windows/x64/runner/Release" "dist/$env:MSI" -Version "${{ needs.version.outputs.version }}"

      - uses: ./.github/actions/upload-built
        with:
          file: dist/${{ env.MSI }}
          artifact: msi
