name: entoli_webview
description: >
  The in-app web view a link and a phone's artifact open in.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  entoli_core:
    path: ../entoli_core
  webview_flutter: ^4.14.1
  # Hybrid composition, which the platform-neutral API cannot ask for.
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Faking the web view: webview_flutter re-exports the creation params but
  # not the classes a fake implementation has to extend.
  webview_flutter_platform_interface: ^2.15.1
