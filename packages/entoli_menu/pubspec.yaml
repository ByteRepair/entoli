name: entoli_menu
description: The app's menu bar on macOS and iPadOS, built by AppKit and UIKit from menus the app sends as data.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  entoli_core:
    path: ../entoli_core
  # The generated contract's annotations.
  meta: any

dev_dependencies:
  flutter_lints: ^6.0.0
  # The protocol's generator, run by tool/prepare.sh.
  pigeon: ^27.3.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MenuModel
        sharedDarwinSource: true
      macos:
        pluginClass: MenuModel
        sharedDarwinSource: true
