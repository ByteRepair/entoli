name: agent_chat
description: "Client-side ChatGPT-style chat UI with a built-in coding agent"
publish_to: "none"

# No `+build` suffix: release.yml derives the Android version code from these
# three numbers, and a second number to bump is a second number to forget.
version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State management
  flutter_riverpod: ^3.4.2

  # Networking
  http: ^1.6.0
  html: ^0.15.6

  # Serialization
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0

  # Path / filesystem
  path: ^1.9.1
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  mime: ^2.0.0
  # A dart:io-shaped FileSystem with an IndexedDB backend, so the web build has
  # the same layout as a disk. See CLAUDE.md, "On-disk layout".
  fs_shim: ^2.5.5
  # Neither a share sheet nor a browser download takes a folder, so a folder
  # leaves the workspace as a zip. See CLAUDE.md, "The workspace explorer".
  archive: ^4.0.9

  # Icons
  flutter_svg: ^2.3.0

  # Markdown rendering for finished message bubbles. Continuation of the
  # discontinued flutter_markdown; same API. `markdown` is its parser, direct
  # here because a `MarkdownElementBuilder` is handed the elements it produces.
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  # Highlighting for fenced code blocks: highlight.js's grammars and themes in
  # pure Dart, so nothing native joins any of the three platforms. Which
  # grammars are registered is in `code_block.dart`.
  re_highlight: ^0.0.3

  # Opening links from rendered markdown: external browser on desktop and
  # web, in-app webview on Android.
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

  # Misc
  uuid: ^4.6.0
  collection: ^1.19.1
  # navigator.storage.persist(), so what the browser stored is not evicted.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  freezed: ^3.2.5

flutter:
  uses-material-design: true

  assets:
    - assets/prompts/commands/
    - assets/prompts/agents/
    - assets/icons/
    # The font's licence, read into `LicenseRegistry` at startup. An asset
    # rather than only a file in the repo, since the OFL asks for it to travel
    # with the font.
    - assets/fonts/OFL.txt

  # Code is set in this rather than in `monospace`, which is a different face on
  # every platform the app runs on. Roboto Mono is the mono companion to the
  # face Material already uses, and it is OFL — `assets/fonts/OFL.txt` ships
  # with it. Bold is here because the highlight themes set a weight on some
  # scopes and synthesised bold in a code block is mush.
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700