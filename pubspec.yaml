name: agent_chat
description: "Client-side ChatGPT-style UI with OpenCode/mini-swe-agent backends"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Networking
  http: ^1.6.0
  dio: ^5.11.0
  web_socket_channel: ^3.0.3

  # Serialization
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0

  # Path / filesystem
  path: ^1.9.1
  path_provider: ^2.1.6

  # Misc
  uuid: ^4.6.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  freezed: ^3.2.5

flutter:
  uses-material-design: true

  assets:
    - assets/python/