name: agent_chat
description: "Client-side ChatGPT-style chat UI with a built-in coding agent"
publish_to: "none"

# No `+build` suffix: release-build.yml derives the Android version code from
# these three numbers, and a second number to bump is a second number to
# forget.
version: 8.8.0

environment:
  sdk: ^3.12.2

# One lock for the app and the packages it shares code with.
workspace:
  - packages/entoli_core
  - packages/entoli_share_viewer
  - packages/entoli_voice
  - packages/entoli_files
  - packages/entoli_links
  - packages/entoli_share
  - packages/entoli_scanner
  - packages/entoli_webview
  - packages/entoli_sync_transport
  - packages/entoli_shell
  - packages/entoli_paths
  - packages/entoli_menu
  - packages/entoli_browser

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # The chat as data and on screen, which the share viewer runs too.
  entoli_core:
    path: packages/entoli_core
  # Voice mode's engines, the microphone and the speaker.
  entoli_voice:
    path: packages/entoli_voice
  # Picking files and handing them to the rest of the device.
  entoli_files:
    path: packages/entoli_files
  # Opening links, and the entoli:// links that open the app.
  entoli_links:
    path: packages/entoli_links
  # The share sheet a chat's share link leaves through.
  entoli_share:
    path: packages/entoli_share
  # The camera that reads a pairing code.
  entoli_scanner:
    path: packages/entoli_scanner
  # The in-app web view a link and a phone's artifact open in.
  entoli_webview:
    path: packages/entoli_webview
  # The WebRTC data channel sync runs over.
  entoli_sync_transport:
    path: packages/entoli_sync_transport
  # Where commands run: the shells, proot, iSH and the bundled tools.
  entoli_shell:
    path: packages/entoli_shell
  # Where this platform keeps the app's data and its cache.
  entoli_paths:
    path: packages/entoli_paths
  # The menu bar on macOS and iPadOS.
  entoli_menu:
    path: packages/entoli_menu
  # The browser the agent drives: Chromium over CDP, or the phones' web views.
  entoli_browser:
    path: packages/entoli_browser

  # State management
  flutter_riverpod: ^3.4.2

  # Networking
  http: ^1.6.0
  html: ^0.15.6
  # Checks a downloaded rootfs against the checksum in the catalog, before
  # anything in it is unpacked and run.
  crypto: ^3.0.7

  # Serialization
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  # Utf8 strings for libc's `getenv` on iOS and the macOS update's
  # `renamex_np`.
  ffi: ^2.1.4

  # Path / filesystem
  path: ^1.9.1
  # The filesystem the core is handed; the app hands it the disk.
  file: ^7.0.1
  mime: ^2.0.0
  # A backup, a shared chat and the archives the tools download.
  archive: ^4.1.0

  # Icons
  flutter_svg: ^2.3.0

  # Markdown rendering for finished message bubbles. Continuation of the
  # discontinued flutter_markdown; same API. `markdown` is its parser, direct
  # here because a `MarkdownElementBuilder` is handed the elements it produces.
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  # TeX in a reply, `$…$` and `$$…$$`: KaTeX's layout in pure Dart, its fonts
  # bundled. Which delimiters are read is `model/math_syntax.dart`.
  flutter_math_fork: ^0.7.4
  # Highlighting for fenced code blocks: highlight.js's grammars and themes in
  # pure Dart, so nothing native joins any of the three platforms. Which
  # grammars are registered is in `code_block.dart`.
  re_highlight: ^0.0.3

  # Misc
  uuid: ^4.6.0
  collection: ^1.19.1
  # A swappable clock so tests pin "now" rather than rotting against the
  # calendar. The reminder feature reads it; see "Reminders" in AGENTS.md.
  clock: ^1.1.2
  cryptography: ^2.9.0
  web_socket_channel: ^3.0.3
  qr_flutter: ^4.1.0
  freedesktop_secret: ^0.1.2
  # The session bus. It was already in the tree through freedesktop_secret's
  # keyring; direct here so Linux reminders can post over
  # org.freedesktop.Notifications — see linux_reminder_alarms.dart.
  dbus: ^0.7.15
  yaml: ^3.1.4
  re_editor: ^0.10.0
  super_sliver_list: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Timers a test drives on a clock of its own rather than waiting one out:
  # a room's retry rounds, a provider's rate limit.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  # Apple silicon only on macOS: x86_64 is not supported, and EntoliMLX has
  # no slice for it. Flutter under Xcode 27 still builds one unless told.
  config:
    enable-macos-arm64-only: true

  assets:
    # Bundled skills and agents are embedded in code by
    # tool/gen_bundled_skills.dart, not shipped as Flutter assets.
    - assets/icons/
    - assets/images/
    # The version About shows, generated from pubspec by tool/prepare.sh.
    # Flutter writes its own version.json for Linux, which overrides this
    # there; on every other platform this is the only copy.
    - assets/version.json
    # Open Bot Avatar's starters and gallery, each a spec the avatar editor
    # reads like any other, and the MIT licence the engine port and the
    # shapes travel under, read into `LicenseRegistry` at startup.
    - assets/bot_avatars/presets.json
    - assets/bot_avatars/open-bot-avatar/presets.json
    - assets/bot_avatars/open-bot-avatar/LICENSE.txt
    # blink's ISC licence, the x86-64 emulator blinkish runs on. Read into
    # `LicenseRegistry` at startup, the way the font licences are.
    - assets/third_party/blink-ISC.txt
    # Byte Repair's install script, run through the configured terminal env to
    # install make, github-cli and ESBMC.
    - assets/scripts/byte-repair-setup.sh
    # The Mozilla root set the TLS fallback verifies against. Dart reads the
    # OS's own root store for its HTTPS trust, and on Windows the store's
    # population is schannel's, on demand, which a dart:io client never
    # triggers: a machine between refreshes has no root for a newer chain, and
    # every handshake dies with "unable to get local issuer certificate" — a
    # fresh VM, an LTSC image, a box between updates. Where the system's trust
    # refuses on a certificate verify alone, the request verifies once against
    # this; see lib/data/tls.dart. Copied from https://curl.se/ca/cacert.pem
    # (its header names its provenance and licence); refresh by re-copying and
    # committing.
    - path: assets/certs/cacert.pem
      platforms: [windows]
