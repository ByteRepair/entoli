name: agent_chat
description: "Client-side ChatGPT-style chat UI with a built-in coding agent"
publish_to: "none"

# No `+build` suffix: release-build.yml derives the Android version code from
# these three numbers, and a second number to bump is a second number to
# forget.
version: 2.2.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State management
  flutter_riverpod: ^3.4.2

  # Networking
  http: ^1.6.0
  html: ^0.15.6
  # Checks a downloaded rootfs against the checksum in the catalog, before
  # anything in it is unpacked and run.
  crypto: ^3.0.7

  # Serialization
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0

  # Path / filesystem
  path: ^1.9.1
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  mime: ^2.0.0
  # A dart:io-shaped FileSystem with an IndexedDB backend, so the web build has
  # the same layout as a disk. See CLAUDE.md, "On-disk layout".
  fs_shim: ^2.5.5
  # Neither a share sheet nor a browser download takes a folder, so a folder
  # leaves the workspace as a zip. See CLAUDE.md, "The workspace explorer".
  archive: ^4.1.0

  # Icons
  flutter_svg: ^2.3.0

  # Markdown rendering for finished message bubbles. Continuation of the
  # discontinued flutter_markdown; same API. `markdown` is its parser, direct
  # here because a `MarkdownElementBuilder` is handed the elements it produces.
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  # Highlighting for fenced code blocks: highlight.js's grammars and themes in
  # pure Dart, so nothing native joins any of the three platforms. Which
  # grammars are registered is in `code_block.dart`.
  re_highlight: ^0.0.3

  # Opening links from rendered markdown: external browser on desktop and
  # web, in-app webview on Android.
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

  # Voice mode. sherpa-onnx is speech recognition, speech synthesis and voice
  # activity detection from one dependency: `record` opens the microphone and
  # `audioplayers` says the reply back. See "Voice mode" in CLAUDE.md, and
  # issue #58 for why a browser gets none of this. The interface and Linux
  # packages are reached directly by the pw-record fallback, `LinuxRecorder`.
  sherpa_onnx: ^1.13.6
  record: ^7.1.1
  record_platform_interface: ^2.1.0
  record_linux: ^2.1.1
  audioplayers: ^6.8.1

  # Misc
  uuid: ^4.6.0
  collection: ^1.19.1
  # A swappable clock so tests pin "now" rather than rotting against the
  # calendar. The reminder feature reads it; see "Reminders" in CLAUDE.md.
  clock: ^1.1.2
  # navigator.storage.persist(), so what the browser stored is not evicted.
  web: ^1.1.1
  flutter_webrtc: ^1.6.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  web_socket_channel: ^3.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  freedesktop_secret: ^0.1.2
  # The session bus. It was already in the tree through freedesktop_secret's
  # keyring; direct here so Linux reminders can post over
  # org.freedesktop.Notifications — see linux_reminder_alarms.dart.
  dbus: ^0.7.15

# `sherpa_onnx` depends on `sherpa_onnx_web` whatever platform is being built,
# and that package ships a 14 MB WebAssembly build of onnxruntime as a
# web-platform asset. Plugin assets are not tree-shaken, so a web build that
# can never run voice mode would carry all of it. See tool/web/sherpa_onnx_web_stub.
dependency_overrides:
  sherpa_onnx_web:
    path: tool/web/sherpa_onnx_web_stub

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Faking the webview: webview_flutter re-exports the creation params but not
  # the classes a fake implementation has to extend.
  webview_flutter_platform_interface: ^2.15.1

  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  freezed: ^3.2.5

flutter:
  uses-material-design: true

  assets:
    # Bundled skills and agents are embedded in code by
    # tool/gen_bundled_skills.dart, not shipped as Flutter assets.
    - assets/icons/
    # The version About shows, generated from pubspec by tool/prepare.sh.
    # Flutter writes its own version.json for Linux and Web, which overrides
    # this where one exists; on every other platform this is the only copy.
    - assets/version.json
    # The fonts' licences, read into `LicenseRegistry` at startup. An asset
    # rather than only a file in the repo, since the OFL asks for it to travel
    # with the font.
    - assets/fonts/OFL.txt
    - assets/fonts/PlayfairDisplay-OFL.txt
    - assets/fonts/SourceSerif4-OFL.txt
    # Silero's voice activity detector, and its licence beside it. 644 KB, so
    # it ships rather than joining the catalog: voice mode that cannot start
    # until a second, invisible download has finished is worse to explain than
    # an app that is slightly bigger. Every model sherpa takes, it takes as a
    # path, so this is copied out of the bundle on first use.
    - path: assets/models/silero_vad.onnx
      platforms: [android, ios, linux, macos, windows]
    - path: assets/models/silero-vad-LICENSE.txt
      platforms: [android, ios, linux, macos, windows]
    # Byte Repair's install script, run through the configured terminal env to
    # install make, github-cli and ESBMC. Platform-gated to keep it off the web
    # build, which has no shell to run it.
    - path: assets/scripts/byte-repair-setup.sh
      platforms: [android, ios, linux, macos, windows]

  # The faces the artifact stylesheet names, bundled so the whole app wears
  # them and not only its artifacts. Both are OFL — `assets/fonts/OFL.txt` and
  # the per-family `-OFL.txt` files ship with them. Static instances rather
  # than the variable fonts: the engine does not read `opsz`, and a 400-to-900
  # `wght` axis makes every weight request synthetise or clamp.
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          style: italic
